<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Admin Login - Instagram Scanner</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e1a;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(124, 58, 237, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            animation: rotateBg 60s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 50px 40px 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -80px;
            right: -80px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.12);
            filter: blur(80px);
            pointer-events: none;
            z-index: -1;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand .icon {
            font-size: 52px;
            display: block;
            margin-bottom: 4px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .brand .sub {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .brand .owner-tag {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 20px;
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            color: #a78bfa;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
            background: rgba(255, 255, 255, 0.07);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            box-shadow: 0 8px 30px rgba(124, 58, 237, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 45px rgba(124, 58, 237, 0.45);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 18px;
            display: none;
            animation: fadeSlide 0.4s ease;
        }

        .alert.show { display: block; }
        .alert-success { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.2); color: #34d399; }
        .alert-error { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; }
        .alert-info { background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.2); color: #60a5fa; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
        }

        .footer strong { color: rgba(255, 255, 255, 0.25); }
        .footer .dev { color: #7c3aed; }
        .footer .owner { color: #ec4899; }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 20px 28px; }
            .brand h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">
            <span class="icon">🔐</span>
            <h1>ScannerAPI</h1>
            <div class="sub">Premium Admin Panel</div>
            <span class="owner-tag">👑 ANSH_AFT</span>
        </div>

        <div id="loginAlert" class="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>👤 Username</label>
                <input type="text" id="loginUsername" placeholder="Enter admin username" value="ANSHAFT127987" required />
            </div>
            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" id="loginPassword" placeholder="Enter admin password" value="ANSHAFTAK47" required />
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                🚀 Login to Dashboard
            </button>
        </form>

        <div class="footer">
            Developed by <strong class="dev">DeveloperBhai</strong> &bull; 
            Owner <strong class="owner">ANSH_AFT</strong>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCIOu1N7PEaDbrduIFPVpOBLw_upyefESE",
            authDomain: "ansh-aft.firebaseapp.com",
            databaseURL: "https://ansh-aft-default-rtdb.firebaseio.com",
            projectId: "ansh-aft",
            storageBucket: "ansh-aft.firebasestorage.app",
            messagingSenderId: "856621572011",
            appId: "1:856621572011:web:76f866cbea624c5f5c7cee",
            measurementId: "G-KJH0NNW1SD"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const ADMIN = {
            username: "ANSHAFT127987",
            password: "ANSHAFTAK47"
        };

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const btn = document.getElementById('loginBtn');
            const alertEl = document.getElementById('loginAlert');

            if (!username || !password) {
                showAlert(alertEl, '⚠️ Please enter username and password', 'error');
                return;
            }

            btn.innerHTML = '<span class="spinner"></span> Logging in...';
            btn.disabled = true;

            if (username !== ADMIN.username || password !== ADMIN.password) {
                db.ref('failed_logins').push({
                    username: username,
                    timestamp: new Date().toISOString(),
                    ip: 'client'
                });
            }

            setTimeout(() => {
                if (username === ADMIN.username && password === ADMIN.password) {
                    showAlert(alertEl, '✅ Login successful! Redirecting...', 'success');
                    sessionStorage.setItem('admin_session', 'true');
                    sessionStorage.setItem('admin_user', username);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    showAlert(alertEl, '❌ Invalid username or password!', 'error');
                    btn.innerHTML = '🚀 Login to Dashboard';
                    btn.disabled = false;
                }
            }, 700);
        }

        function showAlert(el, msg, type = 'info') {
            el.textContent = msg;
            el.className = `alert alert-${type} show`;
            clearTimeout(el._timer);
            el._timer = setTimeout(() => {
                el.classList.remove('show');
            }, 4000);
        }

        (function() {
            if (sessionStorage.getItem('admin_session') === 'true') {
                window.location.href = 'dashboard.html';
            }
        })();
    </script>

</body>
</html>
